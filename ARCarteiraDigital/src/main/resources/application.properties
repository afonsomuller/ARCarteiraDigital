# ============================================
# Application Properties (alternativa ao YAML)
# ============================================

# Application Name
spring.application.name=currency-exchange-api

# ============================================
# Server Configuration
# ============================================
server.port=8080
server.servlet.context-path=/api

# ============================================
# Database Configuration (MySQL)
# ============================================
spring.datasource.url=jdbc:mysql://localhost:3306/currency_exchange_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=@Batata352416
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ============================================
# JPA / Hibernate Configuration
# ============================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.open-in-view=false

# ============================================
# Jackson Configuration
# ============================================
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.serialization.indent-output=true
spring.jackson.time-zone=America/Sao_Paulo

# ============================================
# JWT Configuration
# ============================================
jwt.secret=5Kq8YHj3NmP6Rw9TuV2Xz5aB7cD9fG1hJ3kL5mN7pQ9rS1tU3vW5xY7zA1bC3dE5fG7hJ9kL1mN3pQ5rS7tU9vW
jwt.expiration=86400000
jwt.refresh-expiration=604800000

# ============================================
# BCB API Configuration
# ============================================
bcb.api.base-url=https://olinda.bcb.gov.br/olinda/servico/PTAX/versao/v1/odata
bcb.api.timeout=5000

# ============================================
# Conversion Tax Rate
# ============================================
conversion.tax-rate=0.038

# ============================================
# Swagger/OpenAPI Configuration
# ============================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.display-request-duration=true

# ============================================
# Logging Configuration
# ============================================
logging.level.root=INFO
logging.level.com.cambio=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Logging Pattern
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Log File
logging.file.name=logs/application.log
logging.file.max-size=10MB
logging.file.max-history=30
logging.file.total-size-cap=100MB

# ============================================
# Actuator Configuration
# ============================================
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.metrics.export.prometheus.enabled=true

# ============================================
# Spring Boot Admin (opcional)
# ============================================
spring.boot.admin.client.url=http://localhost:8081
spring.boot.admin.client.instance.name=Currency Exchange API

# ============================================
# Async Configuration
# ============================================
spring.task.execution.pool.core-size=5
spring.task.execution.pool.max-size=10
spring.task.execution.pool.queue-capacity=100
spring.task.execution.thread-name-prefix=async-

# ============================================
# Multipart/File Upload (se necessário)
# ============================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ============================================
# Banner Configuration
# ============================================
spring.banner.location=classpath:banner.txt