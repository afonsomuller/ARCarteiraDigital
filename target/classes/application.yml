spring:
  application:
    name: arcarteira-digital

  datasource:
    url: jdbc:mysql://localhost:3306/arcarteira_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
    username: root
    password: '@Batata352416'
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080
  servlet:
    context-path: /api

jwt:
  secret: ARCarteiraDigital2025SecretKeyForJWTTokenGenerationAndValidation
  expiration: 86400000

bcb:
  api:
    base-url: https://olinda.bcb.gov.br/olinda/servico/PTAX/versao/v1/odata
    timeout: 5000

conversao:
  taxa-imposto: 0.038

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  show-actuator: false

logging:
  level:
    br.pucpr: DEBUG
    org.springframework.security: DEBUG